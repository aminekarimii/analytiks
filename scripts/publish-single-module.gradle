// Task to publish all addon modules
tasks.register('publishAllAddons') {
    group = 'publishing'
    description = 'Publishes all addon modules to Sonatype'

    doLast {
        def addonModules = [
            'analytiks-appsflyer',
            'analytiks-amplitude',
            'analytiks-appvisor',
            'analytiks-azureinsight',
            'analytiks-googleanalytics',
            'analytiks-mixpanel',
            'analytiks-segment',
            'analytiks-timber'
        ]

        def gradleCommand = System.getProperty('os.name').toLowerCase().contains('windows') ? 'gradlew.bat' : './gradlew'

        println """
        ╔════════════════════════════════════════════════════════════════╗
        ║  Publishing All Addon Modules                                  ║
        ╚════════════════════════════════════════════════════════════════╝
        """.stripIndent()

        addonModules.each { moduleName ->
            println "\n📦 Publishing ${moduleName}..."

            try {
                project.exec {
                    commandLine gradleCommand, "publishModule", "-PmoduleName=${moduleName}"
                    workingDir project.rootDir
                }
                println "✅ ${moduleName} published successfully"
            } catch (Exception e) {
                println "❌ Failed to publish ${moduleName}: ${e.message}"
            }
        }

        println """

        ╔════════════════════════════════════════════════════════════════╗
        ║  ✅ Finished publishing all addon modules                      ║
        ╚════════════════════════════════════════════════════════════════╝
        """.stripIndent()
    }
}

