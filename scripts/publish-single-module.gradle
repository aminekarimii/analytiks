// Script to publish a single module to Maven Central
// Usage: ./gradlew publishModule -PmoduleName=analytiks-appsflyer

// Define a task to publish a specific module
tasks.register('publishModule') {
    group = 'publishing'
    description = 'Publishes a single module to Sonatype and releases it. Usage: ./gradlew publishModule -PmoduleName=<module-name>'
    
    doLast {
        if (!project.hasProperty('moduleName')) {
            throw new GradleException("""
                ❌ Module name not specified!
                
                Usage: ./gradlew publishModule -PmoduleName=<module-name>
                
                Available modules:
                  Core modules:
                    - analytiks-core
                    - analytiks
                    - analytiks-bom

                  Addon modules:
                    - analytiks-appsflyer
                    - analytiks-amplitude
                    - analytiks-appvisor
                    - analytiks-azureinsight
                    - analytiks-googleanalytics
                    - analytiks-mixpanel
                    - analytiks-segment
                    - analytiks-timber
                
                Example:
                  ./gradlew publishModule -PmoduleName=analytiks-appsflyer
            """.stripIndent())
        }
        
        def moduleName = project.property('moduleName')
        def moduleProject = null
        
        // Find the module project
        if (moduleName == 'analytiks-core' || moduleName == 'analytiks' || moduleName == 'analytiks-bom') {
            moduleProject = project.findProject(":${moduleName}")
        } else if (moduleName.startsWith('analytiks-')) {
            moduleProject = project.findProject(":addon:${moduleName}")
        } else {
            throw new GradleException("❌ Module '${moduleName}' not found!")
        }
        
        if (moduleProject == null) {
            throw new GradleException("❌ Module '${moduleName}' not found!")
        }
        
        println """
        ╔════════════════════════════════════════════════════════════════╗
        ║  Publishing Module: ${moduleName.padRight(42)} ║
        ╚════════════════════════════════════════════════════════════════╝
        """.stripIndent()

        // Execute the publishing tasks for this specific module
        def modulePath = moduleProject.path
        def gradleCommand = System.getProperty('os.name').toLowerCase().contains('windows') ? 'gradlew.bat' : './gradlew'

        println "📦 Building ${moduleName}..."
        project.exec {
            commandLine gradleCommand, "${modulePath}:build"
            workingDir project.rootDir
        }

        println "📤 Publishing ${moduleName} to Sonatype..."
        project.exec {
            commandLine gradleCommand, "${modulePath}:publishToSonatype"
            workingDir project.rootDir
        }

        println """
        ╔════════════════════════════════════════════════════════════════╗
        ║  ✅ Successfully published ${moduleName.padRight(33)}
        ╚════════════════════════════════════════════════════════════════╝

        📝 Next Steps:
           1. Go to https://central.sonatype.com/publishing
           2. Find your staging repository
           3. Click "Publish" to release to Maven Central

        Or run: ./gradlew closeAndReleaseStagingRepositories
        """.stripIndent()
    }
}

// Task to publish and release a module (includes closing and releasing)
tasks.register('publishAndReleaseModule') {
    group = 'publishing'
    description = 'Publishes a single module to Sonatype and releases it. Usage: ./gradlew publishAndReleaseModule -PmoduleName=<module-name>'

    doLast {
        if (!project.hasProperty('moduleName')) {
            throw new GradleException("""
                ❌ Module name not specified!

                Usage: ./gradlew publishAndReleaseModule -PmoduleName=<module-name>

                Example:
                  ./gradlew publishAndReleaseModule -PmoduleName=analytiks-appsflyer
            """.stripIndent())
        }

        def moduleName = project.property('moduleName')
        def moduleProject = null

        if (moduleName == 'analytiks-core' || moduleName == 'analytiks' || moduleName == 'analytiks-bom') {
            moduleProject = project.findProject(":${moduleName}")
        } else if (moduleName.startsWith('analytiks-')) {
            moduleProject = project.findProject(":addon:${moduleName}")
        } else {
            throw new GradleException("❌ Module '${moduleName}' not found!")
        }

        if (moduleProject == null) {
            throw new GradleException("❌ Module '${moduleName}' not found!")
        }

        def gradleCommand = System.getProperty('os.name').toLowerCase().contains('windows') ? 'gradlew.bat' : './gradlew'
        def modulePath = moduleProject.path

        println """
        ╔════════════════════════════════════════════════════════════════╗
        ║  Publishing and Releasing: ${moduleName.padRight(33)} ║
        ╚════════════════════════════════════════════════════════════════╝
        """.stripIndent()

        println "📦 Building and publishing ${moduleName} to Sonatype..."
        println "🔒 Then closing and releasing staging repository..."
        println ""
        println "⚠️  Running in single Gradle invocation to preserve staging repository..."
        println ""

        project.exec {
            commandLine gradleCommand, "${modulePath}:build", "${modulePath}:publishToSonatype", "closeAndReleaseStagingRepositories"
            workingDir project.rootDir
        }

        println """
        ╔════════════════════════════════════════════════════════════════╗
        ║  ✅ Successfully published and released ${moduleName.padRight(23)} ║
        ╚════════════════════════════════════════════════════════════════╝
        """.stripIndent()
    }
}

